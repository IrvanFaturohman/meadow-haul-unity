<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Meadow Haul</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=540 height=960 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Meadow Haul</div>
      </div>
    </div>
    <pre id="debug-log" style="display:none; position:fixed; left:0; right:0; top:0; max-height:60%; overflow:auto; margin:0; padding:8px; background:rgba(0,0,0,0.82); color:#cfe; font:11px/1.35 monospace; white-space:pre-wrap; word-break:break-word; z-index:1000;"></pre>
    <script>
      // Open the page with #log to see the game's console on screen (for phones, which have no
      // developer tools at hand): GPU and device facts first, then every log, warning and error.
      (function () {
        if (location.hash !== "#log") return;
        var box = document.getElementById("debug-log");
        box.style.display = "block";
        // Each distinct message once, in the order it first came, with how often it repeated, so
        // the first error stays at the top instead of scrolling away under its repeats.
        var order = [], counts = {}, pending = false;
        function render() {
          pending = false;
          box.textContent = order.map(function (m) { return (counts[m] > 1 ? "(x" + counts[m] + ") " : "") + m; }).join("\n");
        }
        function add(kind, args) {
          var text = Array.prototype.map.call(args, function (a) {
            try { return typeof a === "string" ? a : (a && a.stack) || JSON.stringify(a); } catch (e) { return String(a); }
          }).join(" ");
          var m = "[" + kind + "] " + text.slice(0, 600);
          if (!(m in counts)) { counts[m] = 0; if (order.length < 200) order.push(m); }
          counts[m]++;
          if (!pending) { pending = true; setTimeout(render, 250); }
        }
        ["log", "info", "warn", "error"].forEach(function (k) {
          var orig = console[k];
          console[k] = function () { add(k, arguments); orig.apply(console, arguments); };
        });
        window.addEventListener("error", function (e) { add("onerror", [e.message + " @" + e.filename + ":" + e.lineno]); });
        window.addEventListener("unhandledrejection", function (e) { add("rejection", [e.reason]); });
        add("info", ["UA " + navigator.userAgent, "screen " + screen.width + "x" + screen.height + " dpr " + devicePixelRatio]);
        if (navigator.gpu) {
          navigator.gpu.requestAdapter().then(function (a) {
            if (!a) { add("gpu", ["no WebGPU adapter"]); return; }
            var f = []; a.features.forEach(function (x) { f.push(x); });
            add("gpu", ["features: " + f.join(", ")]);
            var l = a.limits;
            add("gpu", ["limits: storageBuffersPerStage " + l.maxStorageBuffersPerShaderStage + ", storageBuffersInVertex " + l.maxStorageBuffersInVertexStage + ", storageBufferSize " + l.maxStorageBufferBindingSize + ", textureDim2D " + l.maxTextureDimension2D]);
            if (a.info) add("gpu", ["adapter: " + a.info.vendor + " " + a.info.architecture + " " + a.info.device + " " + a.info.description]);
          });
        } else add("gpu", ["navigator.gpu missing"]);
      })();
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        // Two data files from the same build: phones get ASTC textures, desktops DXT (WebGPU
        // has no software fallback for a format the GPU lacks).
        dataUrl: buildUrl + (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? "/WebGL.astc.data" : "/WebGL.data"),
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "grass-collect",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: the portrait canvas fits the window's height (9:16), up to 540 x 960.
        var fit = function() {
          var h = Math.max(320, Math.min(960, window.innerHeight - 38));
          canvas.style.height = h + "px";
          canvas.style.width = Math.round(h * 9 / 16) + "px";
        };
        fit();
        window.addEventListener("resize", fit);
      }

      // The game draws its grass with GPU buffers that only WebGPU has on the web.
      if (!navigator.gpu) unityShowBanner("This game needs a browser with WebGPU: a recent Chrome, Edge or Safari.", "error");

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
